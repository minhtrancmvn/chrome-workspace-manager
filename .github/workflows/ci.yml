name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check syntax
        run: |
          bash -n package-extension.sh
          for file in background.js browser-api.js popup.js scripts/*.cjs tests/*.cjs; do
            node --check "$file"
          done
      - name: Run regression tests
        run: |
          mkdir -p test-results
          node --test --test-reporter=tap tests/*.test.cjs > test-results/tests.tap 2>&1
      - name: Show test results
        if: always()
        run: cat test-results/tests.tap
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
